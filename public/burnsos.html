/* Layout: a white gallery holds one retro computer. Scrolling dives through its CRT into a dark
   world where one particle system forms each product; the last scroll pulls back out to the gallery.
   Single look by design: the gallery supplies the light, the inside of the screen supplies the dark. */
:root {
  color-scheme: dark;
  --bg: #05070d;        /* inside the tube */
  --bg-raise: #0c1220;
  --fg: #eef1f7;        /* bone */
  --muted: #98a1b5;
  --faint: #566076;
  --line: rgba(238, 241, 247, 0.14);
  --accent: #ffb35c;    /* sodium amber */
  --accent-ink: #1a1206;
  --ink: #101218;       /* type on the gallery wall */
  --ink-muted: #5c5f68;
  --phos: #7dffa6;      /* CRT phosphor */
  --shadow: 0 50px 90px -30px rgba(0, 0, 0, 0.8);
  --display: "Bricolage Grotesque", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --crt: "VT323", ui-monospace, Menlo, monospace;
  --gutter: clamp(16px, 4vw, 52px);
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
::selection { background: var(--accent); color: var(--accent-ink); }
.wrap { max-width: 1360px; margin-inline: auto; padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); }
.disp { font-family: var(--display); font-weight: 800; font-stretch: 78%; letter-spacing: -0.012em; line-height: 0.92; }

/* the particle canvas lives on the glass and is only as large as the screen, so there is little to composite */
#field { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; border-radius: 9% / 11%; }

/* ---------- HUD (inverts itself over the white gallery) ---------- */
.scrim { position: fixed; inset: 0 0 auto; height: calc(96px + env(safe-area-inset-top, 0px)); z-index: 29; pointer-events: none; opacity: 0; background: linear-gradient(var(--bg) 45%, transparent); }
.hud { position: fixed; z-index: 30; color: #fff; mix-blend-mode: difference; }
.nav { inset: 0 0 auto; padding-top: env(safe-area-inset-top, 0px); }
.nav-in { display: flex; align-items: center; gap: 26px; height: 64px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 19px; letter-spacing: -0.02em; text-decoration: none; margin-right: auto; }
.nav-links { display: flex; gap: 24px; }
.nav-links button { font-size: 15px; opacity: 0.72; transition: opacity .15s; }
.nav-links button:hover { opacity: 1; }
.kbd-btn { display: inline-flex; align-items: center; gap: 10px; height: 34px; padding: 0 8px 0 12px; border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 8px; font-size: 14px; }
.kbd-btn kbd { font-family: var(--mono); font-size: 11px; padding: 2px 6px; border-radius: 5px; background: rgba(255, 255, 255, 0.2); }
.progress { inset: 0 0 auto; height: 2px; background: #fff; transform-origin: 0 50%; transform: scaleX(0); margin-top: env(safe-area-inset-top, 0px); }
.readout { left: max(var(--gutter), env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 18px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; pointer-events: none; font-variant-numeric: tabular-nums; }
.readout span + span { opacity: 0.6; }
.rail { right: max(14px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: flex-end; gap: 0; }
.rail button { display: flex; align-items: center; gap: 10px; height: 20px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
.rail button span { opacity: 0; transform: translateX(6px); transition: opacity .2s, transform .2s; white-space: nowrap; }
.rail button::after { content: ""; width: 12px; height: 1.5px; background: #fff; opacity: 0.45; transition: width .25s, opacity .25s; }
.rail button:hover span, .rail button[aria-current="true"] span { opacity: 1; transform: none; }
.rail button[aria-current="true"]::after, .rail button:hover::after { width: 30px; opacity: 1; }
@media (max-width: 1180px) { .rail { display: none; } }
@media (max-width: 720px) { .nav-links { display: none; } .kbd-btn span { display: none; } .kbd-btn { padding: 0 8px; } .readout { font-size: 10px; gap: 12px; } .readout .opt { display: none; } }

/* ---------- gallery scenes (boot + exit) ---------- */
.scene { position: relative; z-index: 0; }
#boot { height: 100svh; }
.hud, .scrim { display: none !important; }   /* the room and the computer are the whole page */
.pin { position: sticky; top: 0; height: 100svh; overflow: hidden; background: var(--bg); }
.machine { position: absolute; transform-origin: 50% 50%; cursor: pointer; will-change: transform; }
.zoomed .machine { cursor: default; }
.machine img { display: block; width: 100%; height: 100%; object-fit: cover; max-width: none; }
/* a sharper close-up of the computer sits over the wide shot, feathered at its edges, so the machine stays crisp through the zoom */
.machine .near { position: absolute; object-fit: fill; transform-origin: 0 0; will-change: transform;
  /* only the computer itself is the sharp layer; the plinth and wall come from the one room photo, so their edges cannot step */
  -webkit-mask: url(/burnsos/machine-near-mask.webp) 0 0 / 100% 100% no-repeat; mask: url(/burnsos/machine-near-mask.webp) 0 0 / 100% 100% no-repeat; }
.glass { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: radial-gradient(120% 120% at 50% 45%, #07140d, #020503 80%); border-radius: 9% / 11%; transition: border-radius .4s; pointer-events: none; box-shadow: 0 0 0 1.5px #1b1c1a; }
.term { position: absolute; left: 0; top: 0; width: 600px; overflow: hidden; border-radius: 9% / 11%; transform-origin: 0 0; font-family: var(--crt); color: var(--phos); font-size: 30px; line-height: 1; padding: 34px 38px; display: flex; flex-direction: column; justify-content: space-between; text-shadow: 0 0 12px rgba(125, 255, 166, 0.55); pointer-events: none; }
.term p { margin: 0; white-space: nowrap; } .term .dim { opacity: 0.55; }
/* tube power: a spark, a line that snaps across, then the picture blooms open; the reverse on power-off */
.glass::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: radial-gradient(130% 130% at 50% 50%, transparent 58%, rgba(0, 0, 0, 0.55) 100%), linear-gradient(155deg, rgba(255, 255, 255, 0.07) 0%, transparent 22%); }
.glass .pw { position: absolute; inset: 0; z-index: 1; border-radius: inherit; opacity: 0; background: radial-gradient(ellipse at center, #f6fff9 0%, #c4ffd9 38%, rgba(125, 255, 166, 0.8) 100%); }
.glass.on .pw { animation: crt-on .62s cubic-bezier(.2, .7, .2, 1) both; }
.glass.off .pw { animation: crt-off .46s cubic-bezier(.5, 0, .3, 1) both; }
@keyframes crt-on {
  0% { opacity: 0; transform: scaleX(.16) scaleY(.02); } 7% { opacity: 1; transform: scaleX(.55) scaleY(.02); }
  16% { opacity: .9; transform: scaleX(1) scaleY(.02); } 22% { opacity: 1; transform: scaleX(1) scaleY(.02); }
  28% { opacity: .72; transform: scaleX(1) scaleY(.02); } 34% { opacity: 1; transform: scaleX(1) scaleY(.02); }
  56% { opacity: .95; transform: scaleX(1) scaleY(1.03); } 72% { opacity: .5; transform: scaleX(1) scaleY(1); } 100% { opacity: 0; transform: scaleX(1) scaleY(1); }
}
@keyframes crt-off {
  0% { opacity: 1; transform: scaleX(1) scaleY(1); } 15% { opacity: 1; transform: scaleX(1.01) scaleY(.014); } 42% { opacity: 1; transform: scaleX(1) scaleY(.014); }
  75% { opacity: 1; transform: scaleX(.025) scaleY(.03); } 85% { opacity: 1; transform: scaleX(.14) scaleY(.13); } 100% { opacity: 0; transform: scaleX(.02) scaleY(.02); }
}
.term.warm { animation: crt-warmup .78s linear both; }
@keyframes crt-warmup {
  0%, 38% { opacity: 0; filter: brightness(2.6) blur(.6px); } 44% { opacity: 1; filter: brightness(2.3) blur(.5px); } 52% { opacity: .45; filter: brightness(1.7) blur(.2px); }
  60% { opacity: 1; filter: brightness(1.6) blur(.1px); } 74% { opacity: .82; filter: brightness(1.25); } 100% { opacity: 1; filter: none; }
}
@media (prefers-reduced-motion: reduce) { .glass .pw { animation: none !important; } .term.warm { animation: none; } }
/* the key legend from the original site */
.legend { position: absolute; display: flex; flex-direction: column; gap: 9px; align-items: center; left: 50%; bottom: 19vh; transform: translateX(-50%); font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #6f6655; pointer-events: none; white-space: nowrap; }
.legend span { display: inline-flex; gap: 8px; align-items: center; animation: legendfade .45s ease .5s both; }

.legend.zoomed { left: 7vw; bottom: auto; top: 50%; transform: translateY(-50%); align-items: flex-start; gap: 13px; }
.touch .legend, .touch .legend.zoomed { left: 50%; top: auto; bottom: 4vh; transform: translateX(-50%); align-items: center; gap: 6px; letter-spacing: 0.1em; }
@keyframes legendfade { from { opacity: 0; transform: translateY(4px); } }
@media (max-width: 1100px) { .legend.zoomed { left: 50%; top: auto; bottom: 3vh; transform: translateX(-50%); flex-direction: row; gap: 18px; font-size: 10px; } }
.term-os { padding: 26px 30px; font-size: 25px; line-height: 27px; justify-content: flex-start; gap: 10px; }
.term-os .t-head { display: flex; justify-content: space-between; }

/* .env: a video player built into the terminal */
.t-video { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 0.5em; text-shadow: 0 0 10px rgba(125, 255, 166, 0.45); }

.v-frame iframe { position: absolute; left: 50%; top: -48px; height: calc(100% + 96px); aspect-ratio: 16 / 9; width: auto; transform: translateX(-50%); border: 0;   /* 16:9 player, centred behind a 4:3 window: its black side bars and its own controls fall outside */ filter: grayscale(1) sepia(1) hue-rotate(70deg) saturate(2.4) contrast(1.15) brightness(0.9); }
.v-shield { position: absolute; inset: 0; z-index: 1; cursor: pointer; display: grid; place-items: center; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.28) 0 1px, transparent 1px 3px); }
.t-out video.meme { display: block; height: 8.2em; max-width: 60%; margin: 0.5em 0; border: 1px solid rgba(125, 255, 166, 0.45); border-radius: 6px; background: #000; }

.v-bar { display: flex; gap: 1ch; align-items: baseline; } .v-prog { cursor: pointer; flex: none; } .v-bar .sp { flex: 1; }
.t-prompt { display: flex; gap: 10px; align-items: baseline; position: relative; z-index: 1; border-top: 1px solid rgba(125, 255, 166, 0.38); padding-top: 7px; }
.t-prompt #tBuf { white-space: pre; color: #d9ffe8; }

.touch .t-prompt input { display: block; } .touch .t-prompt #tBuf, .touch .t-prompt .caret, .touch .t-prompt #tHint { display: none; }
.term.mini { padding: 58px 70px 50px; }
.term.big { border-radius: 0; padding: max(26px, env(safe-area-inset-top, 0px)) max(34px, env(safe-area-inset-right, 0px)) max(22px, env(safe-area-inset-bottom, 0px)) max(34px, env(safe-area-inset-left, 0px)); }
/* a project, drawn on the screen */

.t-page::-webkit-scrollbar { display: none; }

function renderPal() {
  const q = palInput.value.trim().toLowerCase();
  shown = CMDS.filter((c) => !q || (c.label + " " + c.hint).toLowerCase().includes(q)); sel = Math.min(sel, Math.max(0, shown.length - 1));
  palList.innerHTML = shown.length ? shown.map((c, i) => `<li role="option" data-i="${i}" aria-selected="${i === sel}"><span>${c.label}</span><small>${c.hint}</small></li>`).join("") : `<li class="empty">Nothing matches. Try a project name.</li>`;
  const el = palList.querySelector('[aria-selected="true"]'); if (el) el.scrollIntoView({ block: "nearest" });
}
function openPal() { lastFocus = document.activeElement; pal.hidden = false; palInput.value = ""; sel = 0; renderPal(); palInput.focus(); }
function closePal() { pal.hidden = true; if (lastFocus) lastFocus.focus({ preventScroll: true }); }
function runPal(i) { const c = shown[i]; if (!c) return; closePal(); if (c.href) { const a = document.createElement("a"); a.href = c.href; a.target = "_blank"; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove(); } else c.run(); }
$("palOpen").addEventListener("click", openPal);
palInput.addEventListener("input", () => { sel = 0; renderPal(); });
pal.addEventListener("click", (e) => { const li = e.target.closest("li[data-i]"); if (li) runPal(+li.dataset.i); else if (e.target === pal) closePal(); });
addEventListener("keydown", (e) => {
  
  if (pal.hidden) return;
  if (e.key === "Escape") closePal();
  else if (e.key === "ArrowDown") { e.preventDefault(); sel = (sel + 1) % Math.max(1, shown.length); renderPal(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); sel = (sel - 1 + shown.length) % Math.max(1, shown.length); renderPal(); }
  else if (e.key === "Enter") { e.preventDefault(); runPal(sel); }
  else if (e.key === "Tab") { e.preventDefault(); palInput.focus(); }
});
})();
</script>
</body>
</html>
